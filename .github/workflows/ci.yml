# push와 PR마다 모든 모듈의 테스트를 돌린다 (통합 테스트는 Testcontainers로 MySQL·Redis를 띄운다. GitHub 러너에는 Docker가 있다).
# main에 push되고 테스트가 통과하면 서비스마다 ARM64 이미지를 만들어 GHCR에 올리고,
# platform-infra의 이미지 태그를 이 커밋 해시로 바꿔 push한다 → ArgoCD가 감지해 배포한다 (GitOps, 쿠폰 서버와 같은 방식).
name: CI

on:
  push:
    # 문서만 바뀐 push는 건너뛴다
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 테스트
        run: ./gradlew test
      - name: 실패하면 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: '**/build/reports/tests/test'

  # 서비스(모듈)마다 이미지 하나. 모듈을 추가하면 matrix에 이름을 더한다
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        service: [auth]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: platform-infra-deploy-services
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # deploy key: platform-infra 하나에만 쓰기 권한이 있는 SSH 키 (쿠폰 서버와 다른 키)
      - uses: actions/checkout@v7
        with:
          repository: diz99-art/platform-infra
          ssh-key: ${{ secrets.PLATFORM_INFRA_DEPLOY_KEY }}
          path: platform-infra
      - name: 이미지 태그를 이 커밋 해시로
        working-directory: platform-infra
        env:
          SHA: ${{ github.sha }}
        run: |
          for svc in auth; do
            f="k8s/apps/$svc/kustomization.yaml"
            sed -i -E "s/^(    newTag: ).*/\1${SHA}/" "$f"
            grep -q "newTag: ${SHA}" "$f" || { echo "$f 태그를 바꾸지 못했습니다"; exit 1; }
          done
          git diff --stat
      - name: platform-infra에 push
        working-directory: platform-infra
        env:
          SHA: ${{ github.sha }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if git diff --quiet; then echo "이미 같은 태그입니다. 할 일 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "platform-services: 이미지 ${SHA::7} 배포" -m "platform-services ${SHA}" -m "${SUBJECT%%$'\n'*}"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
